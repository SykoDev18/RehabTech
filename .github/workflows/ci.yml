name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: "3.27.x"

jobs:
  # ───────────────────────────────────────────────
  # 1. Static analysis (always required)
  # ───────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Crashlytics + dotenv expect these files to exist at build time.
      # We don't ship secrets in CI; placeholder values keep the analyzer happy.
      - name: Create placeholder .env
        run: echo "GEMINI_API_KEY=placeholder" > .env

      - run: flutter pub get
      - run: flutter analyze --fatal-warnings

  # ───────────────────────────────────────────────
  # 2. Tests + coverage
  # ───────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create placeholder .env
        run: echo "GEMINI_API_KEY=placeholder" > .env

      - run: flutter pub get
      - run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ───────────────────────────────────────────────
  # 3. Android release build (PRs and pushes to main)
  # ───────────────────────────────────────────────
  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create placeholder .env
        run: echo "GEMINI_API_KEY=placeholder" > .env

      # Optional signing. When KEYSTORE_FILE secret is missing, the build
      # falls back to the debug keystore (suitable for internal testing).
      - name: Detect signing config
        id: signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_FILE secret missing — APK will be debug-signed"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_FILE" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ───────────────────────────────────────────────
  # 4. Firebase App Distribution (only on push to main)
  # ───────────────────────────────────────────────
  distribute:
    name: Distribute to Firebase
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build automático desde ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Autor: ${{ github.actor }}
